name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below so we can investigate and fix it.

        **Was your issue closed but the problem persists?** Due to GitHub permissions, only maintainers can reopen issues. Please comment on the closed issue describing what still doesn't work, and we will reopen it for you.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g. 2025.3.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: device_firmware
    attributes:
      label: Device Firmware Version
      placeholder: "e.g. 4.25"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: |
        Describe the bug clearly. Include:
        - What you were doing when the issue occurred
        - What you expected to happen
        - What actually happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Entries
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: If possible, download the integration diagnostics and paste or attach the JSON.
      render: json
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might help (screenshots etc.)
    validations:
      required: false
