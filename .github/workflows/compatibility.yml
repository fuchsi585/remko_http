name: Compatibility

on:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-stable:
    name: Latest stable dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install latest stable dependencies
        run: python -m pip install --upgrade homeassistant pytest pytest-asyncio

      - name: Show tested versions
        run: python -m pip list

      - name: Run unit tests
        run: python -m pytest

      - name: Check imports against Home Assistant
        run: python -m scripts.check_home_assistant_imports
